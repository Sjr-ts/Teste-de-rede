# Config de REFERENCIA — Zabbix Agent 2 (Windows)
# NAO copiar diretamente para outros PCs: use o instalador unico em
# "execução bat\instalar-tudo.bat" — ele gera este arquivo automaticamente
# com Hostname dinamico, Server detectado e IP adaptativo (HostMetadataItem).
#
# Os valores abaixo sao apenas ilustrativos (PC de teste 192.168.0.131).

# Servidor: o instalador detecta o IP real; aqui valor de exemplo
Server=192.168.0.102
ServerActive=192.168.0.102
Hostname=PC-AQUI-O-NOME-DEVE-SER-DO-PC

# IP adaptativo: HostMetadataItem (dinamico) — NAO usar HostMetadata estatico
HostMetadataItem=inv.meta
UnsafeUserParameters=1
UserParameter=inv.meta,powershell -NoProfile -ExecutionPolicy Bypass -File "C:\Program Files\Zabbix Agent 2\scripts\inv-meta.ps1"

# Logs
LogFile=C:\Program Files\Zabbix Agent 2\zabbix_agent2.log
LogFileSize=10
Timeout=30
ListenPort=10050

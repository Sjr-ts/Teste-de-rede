# =============================================================================
# Zabbix 7.0 LTS — Stack completa para monitoramento preventivo de TI
# Uso: docker compose -f docker-compose.zabbix.yml up -d
# NÃO exponha postgres à rede de usuários.
# =============================================================================
name: zabbix-ti

services:
  postgres:
    image: postgres:16-alpine
    container_name: zbx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${ZBX_DB_PASS:-ZbxTi2026!}
      POSTGRES_DB: zabbix
      PG_DATA: /var/lib/postgresql/data
    volumes:
      - zbx-db:/var/lib/postgresql/data
    networks:
      - zbx-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zabbix"]
      interval: 10s
      timeout: 5s
      retries: 5

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-7.0-latest
    container_name: zbx-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_SERVER_HOST: postgres
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${ZBX_DB_PASS:-ZbxTi2026!}
      POSTGRES_DB: zabbix
      ZBX_CACHESIZE: 128M
      ZBX_HISTORYCACHESIZE: 128M
      ZBX_TRENDCACHESIZE: 32M
      ZBX_VALUECACHESIZE: 64M
      ZBX_STARTPOLLERS: 10
      ZBX_STARTPINGERS: 5
      ZBX_ENABLEREMOTECOMMANDS: 0
      ZBX_LOGSLOWQUERIES: 3000
      ZBX_PROXYCONFIGFREQ: 3600
      TZ: America/Sao_Paulo
    ports:
      - "10051:10051"
    volumes:
      - zbx-server-data:/var/lib/zabbix
      - zbx-server-logs:/var/log/zabbix
    networks:
      - zbx-net

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-7.0-latest
    container_name: zbx-web
    restart: unless-stopped
    depends_on:
      - zabbix-server
      - postgres
    environment:
      ZBX_SERVER_HOST: zabbix-server
      ZBX_SERVER_NAME: Inventario TI - Zabbix
      DB_SERVER_HOST: postgres
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${ZBX_DB_PASS:-ZbxTi2026!}
      POSTGRES_DB: zabbix
      PHP_TZ: America/Sao_Paulo
    ports:
      - "8081:8080"
    networks:
      - zbx-net

  # Opcional: Zabbix Agent 2 no próprio servidor Docker (auto-monitoramento)
  zabbix-agent-local:
    image: zabbix/zabbix-agent2:alpine-7.0-latest
    container_name: zbx-agent-local
    restart: unless-stopped
    depends_on:
      - zabbix-server
    environment:
      ZBX_SERVER_HOST: zabbix-server
      ZBX_HOSTNAME: servidor-monitoramento
    ports:
      - "10050:10050"
    networks:
      - zbx-net

volumes:
  zbx-db:
  zbx-server-data:
  zbx-server-logs:

networks:
  zbx-net:
    driver: bridge

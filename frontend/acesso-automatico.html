<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Inventário TI — Instalação + Acesso Automático</title>
<style>
  body { font-family:'Segoe UI',sans-serif; background:#0d1117; color:#e6edf3;
         display:flex; align-items:center; justify-content:center; height:100vh; margin:0; }
  .box { background:#161b22; border:1px solid #30363d; border-radius:12px;
         padding:28px; width:560px; max-width:95vw; }
  h2 { color:#58a6ff; margin:0 0 8px; }
  .sub { color:#8b949e; font-size:12px; margin-bottom:16px; }
  #status { font-size:14px; padding:10px 0; }
  #detalhes { font-size:11px; color:#8b949e; text-align:left;
              max-height:200px; overflow:auto; border-top:1px solid #30363d; padding-top:10px; }
  .ok { color:#3fb950; } .err { color:#f85149; } .warn { color:#d29922; }
  code { background:#21262d; padding:1px 5px; border-radius:4px; color:#79c0ff; }
  button { margin-top:14px; padding:8px 14px; background:#238636; color:#fff;
           border:0; border-radius:6px; cursor:pointer; font-size:13px; }
</style>
</head>
<body>
<div class="box">
  <h2>⚙️ Inventário TI — Instalação + Acesso Automático</h2>
  <div class="sub">Senhas já embutidas. Descobre o servidor na rede e configura tudo.</div>
  <div id="status" class="warn">Procurando o servidor na rede...</div>
  <div id="detalhes"></div>
</div>

<script>
// ============================================================================
//  CREDENCIAIS EMBUTIDAS (nao digita nada)
// ============================================================================
const CRED = {
  inv:  { u: 'admin', s: 'admin123' },
  zbx:  { u: 'Admin', s: 'Monitor2026!' }
};
// IPs candidatos — inclui o nome do servidor e faixas comuns
const HOSTS = [
  location.hostname, '127.0.0.1', 'localhost',
  'servidor-monitoramento', 'inventario-ti',
  ...Array.from({length: 30}, (_, i) => '192.168.0.' + (i + 100))  // .100-.129
];
const PORTA_INV = 5903, PORTA_ZBX = 8081;
const det = document.getElementById('detalhes');
const status = document.getElementById('status');
function log(m, cls) {
  det.innerHTML += '› <span class="' + (cls||'') + '">' + m + '</span><br>';
  det.scrollTop = det.scrollHeight;
}
async function testar(ip, porta, caminho) {
  try {
    const r = await fetch('http://' + ip + ':' + porta + (caminho || '/actuator/health'),
      { signal: AbortSignal.timeout(500) });
    if (r.ok) return true;
  } catch (e) {}
  return false;
}
async function testarZabbix(ip) {
  // O Zabbix NAO tem /actuator/health (devolve 404 -> sempre "nao encontrado",
  // bug corrigido em 25/11/2026). Qualquer resposta HTTP legivel na porta 8081
  // (200/412/404) prova que ha um servidor Zabbix/nginx respondendo.
  // CORS: /api_jsonrpc.php devolve Access-Control-Allow-Origin: *.
  try {
    const r = await fetch('http://' + ip + ':' + PORTA_ZBX + '/api_jsonrpc.php',
      { signal: AbortSignal.timeout(800) });
    return r.status > 0;
  } catch (e) { return false; }
}
async function acharServidor() {
  // tenta em paralelo, comum em redes DHCP
  const unicos = [...new Set(HOSTS.filter(Boolean))];
  const testes = unicos.map(async ip => (await testar(ip, PORTA_INV)) ? ip : null);
  const resultados = await Promise.all(testes);
  const encontrados = resultados.filter(Boolean);
  for (const ip of encontrados) log('Servidor Inventário encontrado: <code>' + ip + '</code>', 'ok');
  return encontrados[0] || null;
}
(async () => {
  const ip = await acharServidor();
  if (!ip) {
    status.className = 'err';
    status.textContent = 'Servidor não encontrado na rede. Verifique se ele está ligado e na mesma rede.';
    log('Dica: o instalador do agente funciona mesmo sem o painel — rode o INSTALAR-1-CLIQUE.vbs.', 'warn');
    return;
  }
  const base = 'http://' + ip + ':' + PORTA_INV;
  status.className = 'ok';
  status.textContent = '✅ Servidor encontrado em ' + ip;

  // 1) login automático no inventário
  try {
    const r = await fetch(base + '/api/auth/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ username: CRED.inv.u, senha: CRED.inv.s })
    });
    log('Login Inventário TI: ' + (r.ok ? '<span class="ok">OK</span>' : '<span class="err">falhou ' + r.status + '</span>'));
  } catch (e) { log('Login Inventário: ' + e.message, 'err'); }

  // 2) Zabbix (pode estar em outra porta/IP)
  let ipZbx = null;
  for (const h of [ip, '127.0.0.1', location.hostname]) {
    if (h && await testarZabbix(h)) { ipZbx = h; break; }
  }
  if (ipZbx) {
    try {
      const zr = await fetch('http://' + ipZbx + ':' + PORTA_ZBX + '/api_jsonrpc.php', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({jsonrpc:'2.0', method:'user.login',
          params:{username:CRED.zbx.u, password:CRED.zbx.s}, id:1})
      });
      const zj = await zr.json();
      log('Login Zabbix: ' + (zj.result ? '<span class="ok">OK</span>' : '<span class="err">falhou</span>'));
    } catch (e) { log('Zabbix: ' + e.message, 'err'); }
  } else {
    log('Zabbix (porta ' + PORTA_ZBX + ') não encontrado — verifique o Docker.', 'warn');
  }

  // 3) abre os painéis
  window.open(base + '/index.html', '_blank');
  log('Painel Inventário TI aberto.', 'ok');
  if (ipZbx) {
    window.open('http://' + ipZbx + ':' + PORTA_ZBX + '/', '_blank');
    log('Painel Zabbix aberto.', 'ok');
  }
})();
</script>
</body>
</html>
